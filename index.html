<!doctype html>
<html lang="en">
<head>
  <meta charset="utf-8">
  <meta name="viewport" content="width=device-width, initial-scale=1, viewport-fit=cover">
  <meta name="theme-color" content="#050705">
  <meta name="robots" content="noindex">
  <title>Blackthorne Institute · Assessment</title>
  <link rel="preconnect" href="https://fonts.googleapis.com">
  <link rel="preconnect" href="https://fonts.gstatic.com" crossorigin>
  <link href="https://fonts.googleapis.com/css2?family=Cormorant+Garamond:wght@500;600;700&family=Special+Elite&display=swap" rel="stylesheet">
  <link rel="stylesheet" href="styles.css">
  <link rel="stylesheet" href="scares.css">
  <link rel="stylesheet" href="aftermaths.css">
  <link rel="stylesheet" href="countdowns.css">
</head>
<body class="sound-on">
  <div class="scene" aria-hidden="true">
    <div class="scene-frame">
      <div class="scene-image"></div>
      <div class="lamp-glow lamp-white"></div>
      <div class="lamp-glow lamp-red"></div>
      <div class="floor-reflections"></div>
    </div>
    <div class="lightning-flash"></div>
    <div class="fog fog-back"></div>
    <div class="fog fog-front"></div>
    <div class="vignette"></div>
    <div class="grain"></div>
  </div>
  <div id="haunt" class="haunt" aria-hidden="true">
    <div class="eyes" style="left:5%;top:30%"><i></i><i></i></div>
    <div class="eyes" style="left:9%;top:68%"><i></i><i></i></div>
    <div class="eyes" style="right:6%;top:22%"><i></i><i></i></div>
    <div class="eyes" style="right:3.5%;top:58%"><i></i><i></i></div>
  </div>

  <div class="page">
    <header>
      <span class="clinic-mark">Blackthorne Institute</span>
      <div class="controls">
        <button id="soundToggle" class="icon-button" type="button" aria-label="Sound">
          <span class="sound-bars"><i></i><i></i><i></i></span>
        </button>
        <button id="languageToggle" class="language-button" type="button" aria-label="Switch language">DE</button>
      </div>
    </header>

    <main id="slide"></main>

    <footer>
      <button id="back" class="nav-button" type="button"></button>
      <span id="progress" class="progress"></span>
      <button id="next" class="nav-button primary" type="button"></button>
    </footer>
  </div>
  <div id="jumpScare" class="jump-scare" aria-hidden="true"></div>
  <div id="blackout" class="blackout" aria-hidden="true"></div>
  <script src="script.js"></script>
  <script src="scares.js"></script>
  <script src="aftermaths.js"></script>
  <script src="countdowns.js"></script>
</body>
</html>
